x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:

  spring:
    image: ${BACKEND_IMAGE}
    container_name: spring
    logging: *default-logging
    restart: always
    env_file: ./.env
    environment:
      - TZ=Asia/Seoul  # 로그·S3 key 타임스탬프를 KST로 통일
    expose:
      - "8080"
    networks:
      - fespot

  redis:
    image: redis:7.4-alpine
    container_name: redis
    logging: *default-logging
    restart: always
    environment:
      - TZ=Asia/Seoul
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    command:
      - "redis-server"
      - "--appendonly"
      - "yes"
      - "--maxmemory"
      - "192mb"
      - "--maxmemory-policy"
      - "volatile-ttl"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          memory: 64M
    networks:
      - fespot

networks:
  fespot:
    driver: bridge

