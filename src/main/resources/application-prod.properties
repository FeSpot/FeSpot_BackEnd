# Datasource(MySQL)
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}

# JPA (prod mode)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# Flyway (이미 운영 중인 스키마를 V1 베이스라인으로 마킹하고 V2부터 적용)
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# CORS
server.forward-headers-strategy=framework
app.cors.allowed-origin=${FRONT_CORS_ORIGIN}

# Redis (refresh session / access token blacklist)
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=6379

# OAuth (운영 환경에서는 반드시 실제 값 주입 - 기본값은 로컬 부팅용 더미)
oauth.kakao.app-id=${KAKAO_APP_ID}
oauth.google.client-id=${GOOGLE_CLIENT_ID}
oauth.apple.client-id=${APPLE_CLIENT_ID}
# Apple 토큰 교환·revoke용(회원 탈퇴 시 앱스토어 심사 요건)
# APPLE_PRIVATE_KEY: Sign in with Apple 키(p8) PEM 내용. 개행은 리터럴 \n으로 넣어도 된다.
# 미설정 시 부팅은 되지만 revoke가 비활성화되므로 스토어 제출 전 반드시 주입해야 한다.
oauth.apple.team-id=${APPLE_TEAM_ID:}
oauth.apple.key-id=${APPLE_KEY_ID:}
oauth.apple.private-key=${APPLE_PRIVATE_KEY:}
# 탈퇴 시 제공자 연동 해제용. 미설정 시 부팅은 되지만 해당 제공자 해제가 비활성화된다.
oauth.google.client-secret=${GOOGLE_CLIENT_SECRET:}
oauth.kakao.admin-key=${KAKAO_ADMIN_KEY:}

# Swagger
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html

#KTO API KEY
kto.api.service-key=${KTO_API_SERVICE_KEY}

#AI
#AI Client
ai.api.base-url=${AI_API_BASE_URL}
ai.api.connect-timeout=${AI_API_CONNECT_TIMEOUT}
ai.api.read-timeout=${AI_API_READ_TIMEOUT}

