spring.application.name=fespot
server.port=8080

# Datasource(MySQL)
spring.datasource.url=your_db_url
spring.datasource.username=
spring.datasource.password=

# JPA (dev mode)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# Jackson
spring.jackson.mapper.accept-case-insensitive-enums=true

# CORS
app.cors.allowed-origin=http://localhost:5173

# HTTP Client
spring.http.client.connect-timeout=2s
spring.http.client.read-timeout=3s

# JWT
security.jwt.secret-key=${JWT_SECRET}
security.jwt.access-expiration=${JWT_ACCESS_EXPIRATION:1800}
security.jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:1209600}

# Redis (refresh session / access token blacklist)
spring.data.redis.host=localhost
spring.data.redis.port=6379

# OAuth (운영 환경에서는 반드시 실제 값 주입 - 기본값은 로컬 부팅용 더미)
oauth.kakao.app-id=1
oauth.google.client-id=local-google-client-id
oauth.apple.client-id=local.apple.client.id

# Swagger
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
