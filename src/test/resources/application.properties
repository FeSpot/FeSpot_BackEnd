# 테스트 전용 설정 - main의 application.properties를 완전히 대체하므로 필요한 키를 전부 정의한다.
# DB 연결 정보는 Testcontainers @ServiceConnection이 런타임에 덮어쓴다.
spring.application.name=fespot

# Datasource(MySQL) - 더미. 컨테이너 테스트에서는 @ServiceConnection 값이 우선한다.
spring.datasource.url=jdbc:mysql://localhost:3306/fespot_test
spring.datasource.username=test
spring.datasource.password=test

# JPA - Testcontainers의 빈 MySQL에 스키마를 자동 생성하기 위해 update 유지
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# Jackson
spring.jackson.mapper.accept-case-insensitive-enums=true

# CORS
app.cors.allowed-origin=http://localhost:5173

# HTTP Client
spring.http.client.connect-timeout=2s
spring.http.client.read-timeout=3s
ai.api.base-url=http://127.0.0.1:8000

# KTO OpenAPI - serviceKey는 기본값이 없어 더미 필수
kto.api.service-key=test-service-key

# JWT - base64 인코딩된 테스트 전용 시크릿 (실 배포 키 아님)
security.jwt.secret-key=ZmVzcG90LXRlc3Qtc2VjcmV0LWtleS1mb3ItY29udGV4dC1sb2Fkcy0wMTIzNDU2Nzg5YWJjZGVmZ2hpamtsbW4=
security.jwt.access-expiration=1800
security.jwt.refresh-expiration=1209600

# Swagger
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
